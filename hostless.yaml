# Hostless (hostless.cloud) app config — deliberately minimal.
#
# The Dockerfile at the repo root is the default path, so it is not repeated
# here, and the image's own CMD starts the server. The platform's default size
# (0.1 vCPU / 256 MB, one replica) already fits the free pool, so there are no
# sizing overrides to get wrong.
#
# The addon runs with no configuration in mock mode. slskd is NOT part of this
# image: it needs a raw TCP peer port, which only a VM can expose. Set
# SLSKD_URL + SLSKD_API_KEY when slskd runs somewhere reachable.
build:
  system: docker

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
