name: image

on:
  push:
    branches: ["cf-edge-cache"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: soulseek-addon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No SoulSeek account in CI, so this proves the image, the entrypoint and
      # the addon; the slskd branch is exercised by the combined run below.
      - name: Smoke test - addon alone (mock mode)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 -e PORT=3000 soulseek-addon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"mode":"mock"' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/manifest.json
          docker logs smoke
          docker rm -f smoke

      # Reproduces the deploy that died with EROFS: read-only root, no volume.
      - name: Smoke test - read-only root without a volume
        run: |
          set -euo pipefail
          docker run -d --name ro --read-only --tmpfs /tmp -p 3003:3000 \
            -e PORT=3000 soulseek-addon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3003/health > /tmp/health3.json; then break; fi
            sleep 2
          done
          cat /tmp/health3.json
          grep -q '"ok":true' /tmp/health3.json
          docker logs ro
          docker rm -f ro

      # Some platforms override the image ENTRYPOINT with `npm start`.
      - name: Smoke test - started through npm
        run: |
          set -euo pipefail
          docker run -d --name npmstart -p 3004:3000 -e PORT=3000 \
            soulseek-addon:ci npm start
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3004/health > /tmp/health4.json; then break; fi
            sleep 2
          done
          cat /tmp/health4.json
          grep -q '"ok":true' /tmp/health4.json
          docker logs npmstart
          docker logs npmstart 2>&1 | grep -q '\[entrypoint\]'
          docker rm -f npmstart

      # The deploy that found the .NET bundle bug: read-only root, real mode.
      - name: Smoke test - combined start on a read-only root
        run: |
          set -euo pipefail
          KEY=ci-test-key-0123456789abcdef
          docker run -d --name rocombined --read-only --tmpfs /tmp \
            -p 3005:3000 -p 5032:5030 \
            -e PORT=3000 \
            -e SLSKD_USERNAME=ci-test-user \
            -e SLSKD_PASSWORD=ci-test-pass \
            -e SLSKD_API_KEY="$KEY" \
            soulseek-addon:ci
          ready=""
          for i in $(seq 1 45); do
            if curl -fsS -H "X-API-Key: $KEY" \
                http://127.0.0.1:5032/api/v0/searches > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo '--- slskd never answered on a read-only root:'
            docker logs rocombined || true
            docker rm -f rocombined || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3005/health | tee /tmp/health5.json
          grep -q '"mode":"slskd"' /tmp/health5.json
          docker logs --tail 20 rocombined || true
          docker rm -f rocombined

      - name: Smoke test - combined start (slskd + addon)
        run: |
          set -euo pipefail
          KEY=ci-test-key-0123456789abcdef
          docker run -d --name both -p 3001:3000 -p 5031:5030 \
            -e PORT=3000 \
            -e SLSKD_USERNAME=ci-test-user \
            -e SLSKD_PASSWORD=ci-test-pass \
            -e SLSKD_API_KEY="$KEY" \
            soulseek-addon:ci

          # Kestrel needs a few seconds to bind 5030: poll slskd's API instead of
          # sleeping blind, so this is not flaky on a slow runner.
          ready=""
          for i in $(seq 1 45); do
            if curl -fsS -H "X-API-Key: $KEY" \
                http://127.0.0.1:5031/api/v0/searches > /tmp/searches.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo '--- slskd never answered; container state:'
            docker ps -a || true
            docker logs both || true
            docker exec both cat /data/slskd/slskd.yml || true
            exit 1
          fi
          cat /tmp/searches.json

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health > /tmp/health2.json; then break; fi
            sleep 2
          done
          cat /tmp/health2.json
          grep -q '"mode":"slskd"' /tmp/health2.json

          # The generated YAML must carry the same key slskd just accepted.
          docker exec both grep -q "$KEY" /data/slskd/slskd.yml
          docker logs --tail 20 both || true
          docker rm -f both
