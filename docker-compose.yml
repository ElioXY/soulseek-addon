# One service, two processes: slskd + this addon, sharing /data.
#
# 1. cp .env.example .env and set SLSKD_USERNAME, SLSKD_PASSWORD, SLSKD_API_KEY.
# 2. docker compose up -d --build
# 3. Add https://<your-host>/manifest.json in BitChord: Settings -> Sources.
#
# Port 50300 is the SoulSeek peer port and must be reachable from the internet
# for a healthy client. On a host that cannot publish raw TCP (an app-only PaaS)
# leave it out: the container still works, just firewalled.

services:
  soulseek:
    build: .
    container_name: soulseek
    ports:
      - "3000:3000"     # addon: manifest, search, media
      - "50300:50300"   # SoulSeek peer port
    environment:
      PORT: "3000"
      SLSKD_USERNAME: "${SLSKD_USERNAME:?set SLSKD_USERNAME in .env}"
      SLSKD_PASSWORD: "${SLSKD_PASSWORD:?set SLSKD_PASSWORD in .env}"
      SLSKD_API_KEY: "${SLSKD_API_KEY:?set SLSKD_API_KEY in .env}"
      SLSKD_LISTEN_PORT: "50300"
    volumes:
      - ./data:/data
    restart: unless-stopped
